# Pushes and PR updates are hand-offs between agents, not requests for evidence. In the
# Private repository only a manual dispatch starts a runner (pick the narrowest breadth
# that answers the question); the Public repository keeps its automatic main/PR gate.
# Private candidates are verified locally when they are integrated.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      breadth:
        description: representative = Ubuntu Node 22 + package; keyring = adds strict OS stores; full = 5 Node/OS + 3 OS stores
        type: choice
        default: representative
        options: [representative, keyring, full]

# One stable group per PR or ref: a newer read-only run replaces the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    # Every other job needs this one, so a skipped scope means zero runners.
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      product: ${{ steps.scope.outputs.product }}
      test: ${{ steps.scope.outputs.test }}
      keyring: ${{ steps.scope.outputs.keyring }}
      package: ${{ steps.scope.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - id: scope
        run: node demo/web-ci-scope.mjs >> "$GITHUB_OUTPUT"

  web:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Validate CI trigger and concurrency contract
        run: node tests/ci-workflow-structure.mjs
      - run: node --test tests/ci-scope.mjs
      # Static contracts need only Node; no CLI build or dependency restoration.
      - run: node tests/site-content.mjs && node tests/lp-analytics.mjs && node tests/serve-site.mjs
      - name: Private publication regressions
        if: hashFiles('tools/web-publication.test.mjs') != ''
        run: node tools/web-publication.test.mjs

  # ---------------------------------------------------------------------------
  # Portable suite: everything that does NOT need a real OS secret store.
  #
  # The scope job supplies the include list (demo/web-ci-scope.mjs). Full
  # shape: Node 20/22/24 on Linux (cheapest runner), one current Node on macOS
  # and Windows - 5 jobs, not a 3 x 3 cross-product. macOS/Windows catch path,
  # casing and shell-quoting regressions. A `representative` dispatch runs only
  # Ubuntu Node 22; ask for `full` when an OS or Node difference is the question.
  # ---------------------------------------------------------------------------
  test:
    needs: scope
    if: needs.scope.outputs.test != '[]'
    name: test (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.test) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  # ---------------------------------------------------------------------------
  # Real OS secret store end-to-end, on all three platforms we advertise, when
  # the scope job selects it (`keyring`/`full` dispatch, or a Public product change).
  #
  # Why this is a separate job: the `test` job above never touches the real
  # keyring. Every e2e block is gated behind AGENT_KEY_CASE_E2E=1 and is
  # otherwise skipped, so a green `test` job proves nothing about the vault.
  #
  # AGENT_KEY_CASE_E2E_STRICT=1 turns the harness's "backend unavailable ->
  # skip" into a hard error (tests/run-tests.mjs, openRealVaultForE2E). Without
  # it this job could report success against a dead keyring, which is exactly
  # the failure mode it exists to prevent. The flag is test-harness-only: it
  # does not change vault behaviour and adds no way to read a stored value.
  # ---------------------------------------------------------------------------
  keyring-e2e:
    needs: scope
    if: needs.scope.outputs.keyring != '[]'
    name: keyring e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A keychain/credential prompt on a headless runner would hang forever
    # rather than fail; cap it so that shows up as a timeout, not a 6h job.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.keyring) }}
    env:
      AGENT_KEY_CASE_E2E: "1"
      AGENT_KEY_CASE_E2E_STRICT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      # macOS: the runner's login keychain is usable by the `runner` user as
      # is - no `security unlock-keychain` and no dedicated temporary keychain
      # are needed. (Upstream @napi-rs/keyring and keyring-rs both exercise the
      # real Keychain on macos-latest with zero keychain setup.) This step is
      # diagnostics only and must never fail the job: if Apple ever changes
      # that, the log tells us whether the default keychain was locked before
      # the e2e run failed.
      - name: Keychain diagnostics (macOS)
        if: runner.os == 'macOS'
        run: |
          security default-keychain || true
          security list-keychains || true
          security show-keychain-info "$(security default-keychain | tr -d ' \"')" || true

      # Linux is the only platform with no secret store on a bare runner: the
      # backend talks to a D-Bus Secret Service, so one has to be installed,
      # started AND unlocked or every keyring call fails.
      - name: Install a D-Bus Secret Service (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gnome-keyring dbus dbus-x11

      - name: Run e2e inside a private D-Bus session (Linux)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -eu -c '
            # Start from a fresh login keyring so --unlock creates one with a
            # password we know, instead of colliding with an existing locked
            # keyring. The password is meaningless: it guards a throwaway
            # keyring on an ephemeral runner and no real secret is stored here.
            rm -f "$HOME/.local/share/keyrings/"*
            gnome-keyring-daemon --components=secrets --daemonize --unlock <<< "api-key-case-ci"

            # Prove the Secret Service actually reached the session bus BEFORE
            # running the suite, so an infrastructure failure is never mistaken
            # for a product failure (and never silently tolerated).
            ready=0
            for _ in $(seq 1 20); do
              if dbus-send --session --print-reply --dest=org.freedesktop.DBus \
                   /org/freedesktop/DBus org.freedesktop.DBus.ListNames \
                   | grep -q "org.freedesktop.secrets"; then
                ready=1
                break
              fi
              sleep 0.5
            done
            if [ "$ready" != "1" ]; then
              echo "::error::org.freedesktop.secrets never appeared on the session bus - the Linux Secret Service did not start."
              exit 1
            fi

            node tests/run-tests.mjs --keyring-only
          '

      # Windows Credential Manager and the macOS Keychain need no bootstrap.
      - name: Run e2e (macOS / Windows)
        if: runner.os != 'Linux'
        run: node tests/run-tests.mjs --keyring-only

  package:
    needs: [scope, test]
    if: needs.scope.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The portable matrix already passed on this SHA. Build this clean tree
      # and check the file list without repeating the full prepack test suite.
      - run: npm run build
      - run: npm pack --dry-run --ignore-scripts
